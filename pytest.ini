[pytest]
# 标记注册（NFR-19 / US-EV-01）：需要真实模型后端或出网的用例一律打 llm 标记，
# 评审者在没有云凭证的机器上跑 `pytest -m "not llm"` 就必须把它们排除掉，
# 而不是"跑一半报网络错误"。没有这个文件，-m "not llm" 会静默收集全部用例。
markers =
    llm: 需要真实模型后端（云 API / Ollama）或出网的用例；无凭证时跳过
    slow: 启动真实进程等耗时用例
    postgres: 需要真实 PostgreSQL 18 维护库连接；未设置 WCA_TEST_POSTGRES_URL 时跳过
testpaths = tests
